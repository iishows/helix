<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Helix">
  <defs>
    <linearGradient id="wm-a" x1="24" y1="20" x2="84" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7BFF"/>
      <stop offset="1" stop-color="#5B4BD6"/>
    </linearGradient>
    <linearGradient id="wm-b" x1="84" y1="20" x2="24" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD1E0"/>
      <stop offset="1" stop-color="#3AA6C9"/>
    </linearGradient>
  </defs>

  <!-- 缩小的双螺旋标记 -->
  <g transform="translate(8,10) scale(0.2)">
    <path d="M176 96 C 336 160, 336 352, 176 416" stroke="url(#wm-a)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M336 96 C 176 160, 176 352, 336 416" stroke="url(#wm-b)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <g stroke="#141227" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round">
      <line x1="196" y1="216" x2="316" y2="216"/>
      <line x1="196" y1="296" x2="316" y2="296"/>
    </g>
  </g>

  <text x="140" y="80"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="1"
        fill="currentColor">Helix</text>
</svg>
